<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepairDesk Global</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#0f1115;color:#fff;padding:14px;margin:0}
.card{background:#1a1e27;border:1px solid #2a2f3f;border-radius:14px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:12px;background:#0f1115;border:1px solid #2a2f3f;border-radius:10px;color:#fff;margin-top:8px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;margin-top:10px;cursor:pointer}
.btn-primary{background:#4f6cff;color:#fff}.btn-ghost{background:#242a3a;color:#aab}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<h2>RepairDesk Global 🌍</h2><p id="status" style="color:#888;font-size:13px">Cloud sync ready</p>
<div id="authBox" class="card">
<h3>Sign In / Sign Up</h3>
<input id="email" placeholder="Your Email"><input id="pass" type="password" placeholder="Password (6+ chars)">
<div class="row"><button class="btn btn-primary" onclick="signUp()">Sign Up</button><button class="btn btn-ghost" onclick="signIn()">Sign In</button></div>
</div>
<div id="app" style="display:none">
<div class="card"><b>User:</b> <span id="uEmail"></span> <button class="btn btn-ghost" onclick="signOut()">Logout</button></div>
<div class="card" style="border-color:#ffcc00;background:#2a2410">
<h3>🔔 Live Visits - Who Entered Your Website</h3><div id="visitList" style="font-size:13px;line-height:1.7">Loading...</div>
<button class="btn btn-ghost" onclick="loadVisits()">🔄 Refresh Visits</button>
</div>
<div class="card"><h3>Add Job</h3>
<input id="cName" placeholder="Customer Name"><input id="cPhone" placeholder="Phone">
<div class="row"><input id="pModel" placeholder="Model e.g Tecno Camon"><select id="pIssue"><option>FRP Lock</option><option>iCloud</option><option>Network Unlock</option><option>Hardware</option><option>Software</option></select></div>
<div class="row"><input id="pPrice" type="number" placeholder="Price"><input id="pCost" type="number" placeholder="Cost"></div>
<select id="pStatus"><option>Received</option><option>Working</option><option>Done</option><option>Delivered</option></select>
<button class="btn btn-primary" onclick="addJob()">+ Add Job</button>
</div>
<div id="list"></div>
</div>
<script>
const SUPA_URL = "https://tmcbhvbctcngrcnwrptp.supabase.co";
const SUPA_KEY = "sb_publishable_dYNLLwvMPJlnpBuf7iaRYA_-bNh8y2p";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
async function signUp(){ const r=await supa.auth.signUp({email:email.value,password:pass.value}); alert(r.error?r.error.message:'Account created! Click Sign In now'); }
async function signIn(){ const r=await supa.auth.signInWithPassword({email:email.value,password:pass.value}); if(r.error) alert(r.error.message); else init(); }
async function signOut(){ await supa.auth.signOut(); location.reload(); }
async function init(){
 const {data:{user}} = await supa.auth.getUser();
 if(!user) return;
 document.getElementById('authBox').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('uEmail').textContent=user.email;
 document.getElementById('status').textContent='Cloud ON - works on phone + laptop';
 try{ await supa.from('visits').insert({email:user.email, user_agent:navigator.userAgent}); }catch(e){}
 loadVisits(); loadJobs();
}
async function loadVisits(){
 const {data,error} = await supa.from('visits').select('*').order('created_at',{ascending:false}).limit(50);
 if(error){ document.getElementById('visitList').innerHTML=error.message; return; }
 if(!data.length){ document.getElementById('visitList').innerHTML='No visits yet - share your link!'; return; }
 document.getElementById('visitList').innerHTML = data.map(v=>`• <b>${v.email}</b> - ${new Date(v.created_at).toLocaleString()}<br><small>${(v.user_agent||'').slice(0,70)}</small>`).join('<br><br>');
}
async function addJob(){
 const {data:{user}} = await supa.auth.getUser();
 if(!cName.value){ alert('Add customer name'); return; }
 const row={user_id:user.id, name:cName.value, phone:cPhone.value, model:pModel.value, issue:pIssue.value, price:pPrice.value||0, cost:pCost.value||0, status:pStatus.value, date:new Date().toLocaleDateString()};
 const {error} = await supa.from('jobs').insert(row);
 if(error) alert(error.message); else { cName.value=''; cPhone.value=''; pModel.value=''; loadJobs(); }
}
async function loadJobs(){
 const {data} = await supa.from('jobs').select('*').order('created_at',{ascending:false});
 if(!data) return;
 document.getElementById('list').innerHTML = data.map(j=>`<div class="card"><b>${j.name} - ${j.model}</b> [${j.status}]<br><small>${j.issue} | ${j.phone} | Profit: ${(j.price-j.cost)||0}</small><br><button class="btn btn-ghost" onclick="delJob(${j.id})">Delete</button></div>`).join('');
}
async function delJob(id){ await supa.from('jobs').delete().eq('id',id); loadJobs(); }
supa.auth.getUser().then(({data})=>{ if(data.user) init(); });
</script></body></html>
