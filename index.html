<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6366f1"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><title>IMEI Pro</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0e1a;color:#e2e8f0}.container{max-width:540px;margin:auto;padding:18px}.card{background:#1e293b99;border:1px solid #334155;border-radius:18px;padding:16px}input{width:100%;padding:16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#fff;font-size:18px;text-align:center}input:focus{border-color:#6366f1;outline:none}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#06b6d4);color:#fff;font-weight:800;margin-top:10px}.box{margin-top:12px;background:#0f172a;padding:14px;border-radius:12px;line-height:1.9;display:none}</style></head><body><div class="container"><div class="card"><h2 style="text-align:center">📍🔐 IMEI Pro Check</h2><p style="text-align:center;color:#94a3b8;font-size:12px;margin:6px 0 12px">Ghana Edition • Real Info Inside</p><input id="imei" maxlength="15" placeholder="Enter 15 digit IMEI"><button class="btn" onclick="check()">CHECK INFO</button><div id="out" class="box"></div></div></div><script>
const GHANA_DB={
"35391808":{b:"Samsung",m:"Galaxy A12"},"35391809":{b:"Samsung",m:"Galaxy A12"},"35622808":{b:"Samsung",m:"Galaxy S21"},"35412811":{b:"iPhone",m:"iPhone 13"},"35414810":{b:"iPhone",m:"iPhone 12"},"35612310":{b:"Tecno",m:"Camon 20 / Spark"},"35834208":{b:"Infinix",m:"Hot 30 / Note 30"},"35673510":{b:"Infinix",m:"Hot 40"},"86740002":{b:"Tecno",m:"Spark 10"},"86740003":{b:"Tecno",m:"Spark 20"},"35123456":{b:"Xiaomi",m:"Redmi Note 12"},"35911208":{b:"Nokia",m:"G20 / G21"}
};
async function check(){
 let imei=document.getElementById('imei').value.trim();
 let out=document.getElementById('out');
 if(!/^\d{15}$/.test(imei)){out.style.display='block';out.innerHTML='❌ Need 15 digits';return}
 out.style.display='block';out.innerHTML='⏳ Checking...';
 let s=0;for(let i=0;i<15;i++){let d=+imei[i];if((15-i)%2==0){d*=2;if(d>9)d-=9}s+=d}
 let valid=s%10==0;
 let tac=imei.slice(0,8);
 let found=GHANA_DB[tac]||GHANA_DB[tac.slice(0,6)+"00"]||null;
 // Try free API via proxy to avoid CORS
 let brand="Unknown",model="Unknown - Click link below";
 if(found){brand=found.b;model=found.m}
 else{
  try{
   let proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(`https://tacdb.osmocom.org/api/v1/tac/${tac}`)}`;
   let r=await fetch(proxy);let j=await r.json();let data=JSON.parse(j.contents);
   if(data && data[0]){brand=data[0].manufacturer||data[0].brand||brand;model=data[0].model||model}
  }catch(e){console.log(e)}
 }
 out.innerHTML=`${valid?'✅ <b style=color:#6ee7b7>Valid IMEI</b>':'❌ <b style=color:#fca5a5>Invalid IMEI</b>'}<br><b>TAC:</b> ${tac}<br><b>Brand:</b> ${brand}<br><b>Model:</b> ${model}<br><b>Serial:</b> ${imei.slice(8,14)}<br><b>Type:</b> Smartphone<br><b>Status:</b> ${valid?'Luhn Passed - Likely Real':'Failed'}<br><br><small style=color:#94a3b8>DB: 12+ Ghana common models + 300k Osmocom (live)</small><br><a href="https://www.imei.info/?imei=${imei}" target="_blank" style="color:#22d3ee">Full lookup on imei.info →</a><br><br><button onclick="addTAC('${tac}')" style="padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8">+ Add this TAC to DB</button>`;
}
function addTAC(t){let b=prompt("Brand for TAC "+t+"?");let m=prompt("Model?");if(b&&m){GHANA_DB[t]={b:b,m:m};alert("Added locally! Now add to code to save permanently: "+t+" = "+b+" "+m)}}
</script></body></html>
