<title>IMEI Checker - Free Valid IMEI Tool</title>15<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMEI Checker</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:12px}
.box{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin-top:20px}
input{width:100%;padding:14px;border-radius:10px;border:none;background:#222;color:#fff;font-size:18px;letter-spacing:2px;text-align:center;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:none;background:#22c55e;color:#000;font-weight:900;font-size:16px}
.result{margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-weight:700;display:none}
.ok{background:#14532d;color:#86efac;display:block}
.bad{background:#7f1d1d;color:#fca5a5;display:block}
small{color:#888}
</style>
</head>
<body>
<h2>project-1</h2>
<p>IMEI checker - Offline Tool</p>
<div class="box">
<input id="imei" placeholder="Enter 15-digit IMEI" maxlength="15" inputmode="numeric">
<button onclick="check()">CHECK IMEI</button>
<div id="res" class="result"></div>
<small>• Checks Luhn algorithm only<br>• Does not unlock or bypass anything</small>
</div>

<script>
function luhnCheck(num){
 let sum=0;
 for(let i=0;i<15;i++){
  let d=parseInt(num[14-i]);
  if(i%2==1){d*=2; if(d>9)d-=9;}
  sum+=d;
 }
 return sum%10==0;
}
function check(){
 const v=document.getElementById('imei').value.trim();
 const r=document.getElementById('res');
 if(!/^\d{15}$/.test(v)){ r.className='result bad'; r.textContent='❌ Invalid: Must be 15 digits'; return;}
 if(luhnCheck(v)){ r.className='result ok'; r.textContent='✅ Valid IMEI format';}
 else{ r.className='result bad'; r.textContent='❌ Invalid IMEI (Luhn failed)';}
}
</script>
</body>
</html>
