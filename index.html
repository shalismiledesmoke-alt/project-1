<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="5ZYX28dn7MoreUZg6hFdFnG0AqjyeCayELTGD-C71mo" />
<meta name="description" content="Free IMEI checker - Offline Tool - Validates 15-digit IMEI using Luhn algorithm. No data sent online.">
<meta name="keywords" content="IMEI checker, IMEI validator, check IMEI Ghana, free IMEI tool">
<title>IMEI Checker - Offline Tool</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;padding:15px;margin:0}
h2{margin:10px 0 5px 0}
.box{background:#1e1e1e;padding:15px;border-radius:12px;border:1px solid #333}
input{width:100%;padding:14px;border-radius:8px;border:none;background:#2a2a2a;color:white;text-align:center;font-size:18px;letter-spacing:2px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:10px;border-radius:8px;border:none;background:#22c55e;color:black;font-weight:bold;font-size:16px;cursor:pointer}
#result{margin-top:10px;padding:12px;border-radius:8px;text-align:center;font-weight:bold;display:none}
.valid{background:#14532d;color:#bbf7d0}
.invalid{background:#7f1d1d;color:#fecaca}
small{color:#aaa;display:block;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
15
<h2>project-1</h2>
<p>IMEI checker - Offline Tool</p>
<div class="box">
<input id="imei" type="text" inputmode="numeric" placeholder="Enter 15-digit IMEI" maxlength="15">
<button onclick="checkIMEI()">CHECK IMEI</button>
<div id="result"></div>
<small>• Checks Luhn algorithm only<br>• Does not unlock or bypass anything<br>• 100% offline - no data sent</small>
</div>

<script>
function checkIMEI(){
 const imei=document.getElementById('imei').value.trim();
 const res=document.getElementById('result');
 res.style.display='block';
 if(!/^\d{15}$/.test(imei)){
   res.className='invalid';
   res.innerHTML='❌ Invalid: Must be 15 digits';
   return;
 }
 let sum=0;
 for(let i=0;i<15;i++){
   let d=parseInt(imei[i]);
   if((15-i)%2===0){d*=2; if(d>9)d-=9;}
   sum+=d;
 }
 if(sum%10===0){
   res.className='valid';
   res.innerHTML='✅ Valid IMEI - Luhn check passed';
 } else {
   res.className='invalid';
   res.innerHTML='❌ Invalid IMEI - Luhn check failed';
 }
}
</script>
</body>
</html>
