<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6366f1"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><title>IMEI Pro</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0e1a;color:#e2e8f0;min-height:100vh}.container{max-width:540px;margin:auto;padding:18px}.header{padding:24px 0;text-align:center}.card{background:#1e293b99;border:1px solid #334155;border-radius:18px;padding:16px;margin-bottom:12px}input{width:100%;padding:16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#fff;font-size:18px;text-align:center}input:focus{border-color:#6366f1;outline:none}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#06b6d4);color:#fff;font-weight:800;margin-top:10px}.box{margin-top:12px;background:#0f172a;padding:12px;border-radius:12px;line-height:2;display:none;font-size:14px}.ok{color:#6ee7b7}.bad{color:#fca5a5}</style></head><body><div class="container"><div class="header"><h1>📍🔐 IMEI Pro Check</h1><p style="color:#94a3b8">Real Brand & Model - Inside App</p></div><div class="card"><input id="imei" maxlength="15" placeholder="Enter 15 digit IMEI"><button class="btn" onclick="check()">CHECK REAL INFO</button><div id="out" class="box"></div></div></div><script>
async function check(){
 let imei=document.getElementById('imei').value.trim();
 let out=document.getElementById('out');
 if(!/^\d{15}$/.test(imei)){out.style.display='block';out.innerHTML='<span class=bad>❌ Need 15 digits</span>';return}
 out.style.display='block';out.innerHTML='⏳ Checking TAC database...';
 // Luhn
 let s=0;for(let i=0;i<15;i++){let d=+imei[i];if((15-i)%2==0){d*=2;if(d>9)d-=9}s+=d}
 let valid=s%10==0;
 let tac=imei.slice(0,8);
 try{
  // FREE Osmocom TAC DB - no key needed
  let r=await fetch(`https://tacdb.osmocom.org/api/v1/tac/${tac}`);
  let j=await r.json();
  let brand=j[0]?.manufacturer||j[0]?.brand||'Unknown';
  let model=j[0]?.model||j[0]?.marketing_name||'Unknown';
  let type=j[0]?.type||'Smartphone';
  out.innerHTML=`<span class=${valid?'ok':'bad'}>${valid?'✅ Valid IMEI':'❌ Invalid Luhn'}</span><br><b>TAC:</b> ${tac}<br><b>Brand:</b> ${brand}<br><b>Model:</b> ${model}<br><b>Type:</b> ${type}<br><b>Serial:</b> ${imei.slice(8,14)}<br><b>Check Digit:</b> ${imei[14]}<br><br><small style="color:#94a3b8">Source: Osmocom TAC DB (300k devices) - Free & Inside App</small>`;
 }catch(e){
  out.innerHTML=`<span class=${valid?'ok':'bad'}>${valid?'✅ Valid IMEI':'❌ Invalid'}</span><br><b>TAC:</b> ${tac}<br><b>Note:</b> Offline check only (TAC DB blocked CORS, but Luhn passed).<br>For model: <a href="https://tacdb.osmocom.org/tac/${tac}" target="_blank" style="color:#22d3ee">View TAC ${tac}</a>`;
 }
}
</script></body></html>
